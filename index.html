<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#04050a">
  <title>Kubo — Organizador Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/Logotipo.svg">
  <link rel="apple-touch-icon" href="assets/Logotipo.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- PIN Code Lock Screen Overlay -->
  <div id="pin-lock-screen" class="pin-overlay hidden">
    <div class="pin-card">
      <div class="pin-icon" style="background: rgba(92,158,173,0.15); border: 1px solid rgba(92,158,173,0.3);">
        <img src="assets/Logotipo.svg" alt="Kubo" style="width: 42px; height: 42px; display: block;">
      </div>
      <h2>Kubo</h2>
      <p>Digite seu PIN para desbloquear</p>
      <div class="pin-dots" id="pin-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div id="pin-error-msg" class="pin-error-msg hidden"></div>
      <div class="pin-pad">
        <button class="pin-btn" data-val="1">1</button>
        <button class="pin-btn" data-val="2">2</button>
        <button class="pin-btn" data-val="3">3</button>
        <button class="pin-btn" data-val="4">4</button>
        <button class="pin-btn" data-val="5">5</button>
        <button class="pin-btn" data-val="6">6</button>
        <button class="pin-btn" data-val="7">7</button>
        <button class="pin-btn" data-val="8">8</button>
        <button class="pin-btn" data-val="9">9</button>
        <button class="pin-btn pin-action" id="pin-clear" title="Limpar Tudo"><span
            style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;">Limpar</span></button>
        <button class="pin-btn" data-val="0">0</button>
        <button class="pin-btn pin-action" id="pin-del" title="Apagar Último"><span
            style="font-size: 1.2rem;">⌫</span></button>
      </div>
    </div>
  </div>

  <!-- App Wrapper -->
  <div class="app-container">

    <!-- Header Navigation (iOS Style) -->
    <header class="app-header">
      <div class="header-left">
        <button id="theme-toggle" class="icon-btn" title="Alternar Tema">
          <span class="theme-icon moon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
          <span class="theme-icon sun">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
        </button>
        <button id="btn-lock-app" class="icon-btn" title="Bloquear App" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>

      <div class="header-center">
        <img src="assets/Logo-Horizontal.svg" alt="Kubo" class="header-logo-img">
      </div>

      <div class="header-right">
        <button onclick="window.openAddTransactionModal('expense')" class="icon-btn" title="Nova Transação">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main View Content Area -->
    <main id="main-content" class="main-content">

      <!-- View 1: Dashboard -->
      <section id="view-dashboard" class="tab-view active">
        <!-- Rendered by JS -->
      </section>

      <!-- View 2: Transactions -->
      <section id="view-transactions" class="tab-view hidden">
        <!-- Rendered by JS -->
      </section>

      <!-- View 3: Carteira (Bancos, Cartões & Contas a Pagar) -->
      <section id="view-accounts" class="tab-view hidden">
        <!-- Rendered by JS -->
      </section>

      <!-- View 4: Análise & Planejamento (Relatórios, Orçamentos & Metas) -->
      <section id="view-reports" class="tab-view hidden">
        <!-- Rendered by JS -->
      </section>

      <!-- View 5: Ferramentas & Ajustes -->
      <section id="view-tools" class="tab-view hidden">
        <!-- Rendered by JS -->
      </section>

    </main>

    <!-- Floating Action Button (+ New Transaction) -->
    <button id="fab-add-transaction" class="fab-button" aria-label="Nova Transação">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <!-- Floating Pill Tab Bar -->
    <div class="tab-bar-wrapper">
      <nav class="ios-tab-bar" id="ios-tab-bar">
        <!-- Active indicator pill (animated) -->
        <div class="tab-active-indicator" id="tab-active-indicator"></div>

        <button class="tab-item active" data-target="view-dashboard">
          <div class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="tab-label">Início</span>
        </button>

        <button class="tab-item" data-target="view-transactions">
          <div class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </div>
          <span class="tab-label">Extrato</span>
        </button>

        <button class="tab-item" data-target="view-accounts">
          <div class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
          </div>
          <span class="tab-label">Carteira</span>
        </button>

        <button class="tab-item" data-target="view-reports">
          <div class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </div>
          <span class="tab-label">Planejar</span>
        </button>

        <button class="tab-item" data-target="view-tools">
          <div class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
          </div>
          <span class="tab-label">Mais</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Reusable iOS Slide-up Modal Sheet Container -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-sheet">
      <div class="modal-drag-handle"></div>
      <div class="modal-header">
        <h3 id="modal-title">Título do Modal</h3>
        <button id="modal-close-btn" class="modal-close" onclick="window.closeModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Dynamic content injected here -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- App Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/transactions.js"></script>
  <script src="js/components/accounts.js"></script>
  <script src="js/components/budgets.js"></script>
  <script src="js/components/reports.js"></script>
  <script src="js/components/bills.js"></script>
  <script src="js/components/tools.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
